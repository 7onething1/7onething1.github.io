<p class=sub>7-lane mixer: bass, guitar, kick, snare, toms, hi-hat, cymbals. Audited clean (drums present, no starts/stops). Solo, mute, volume per lane. &middot; 1 songs.</p>

<script>
const SONGS = [
  {stub:"song10", label:"Song10"}
];
const MEDIA = "https://7onething1.github.io/jam-rebuild-song10-stems/stems";
const EXT = "mp3";
const LANES = [
  {key:"bass", label:"Bass"},
  {key:"guitar", label:"Guitar"},
  {key:"kick", label:"Kick"},
  {key:"snare", label:"Snare"},
  {key:"toms", label:"Toms"},
  {key:"hihat", label:"Hi-Hat"},
  {key:"cymbals", label:"Cymbals"}
];
const songSel=document.getElementById('song'),mixer=document.getElementById('mixer'),playBtn=document.getElementById('play'),stopBtn=document.getElementById('stop'),timeEl=document.getElementById('time'),scrub=document.getElementById('scrub'),statusEl=document.getElementById('status');
const audios={},nodes={},ui={};let soloed=new Set(),muted=new Set();let playing=false,ctx=null;const RAMP=0.012;
function ensureCtx(){if(ctx)return ctx;const AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();return ctx;}
function fmt(t){if(!isFinite(t))return '0:00';const m=Math.floor(t/60);const s=Math.floor(t%60).toString().padStart(2,'0');return m+':'+s;}
function rebuildLanes(stub){
  mixer.innerHTML='';
  Object.values(audios).forEach(a=>{try{a.pause();}catch(_){}a.src='';a.removeAttribute('src');a.load();});
  Object.values(nodes).forEach(n=>{try{n.src.disconnect();n.gain.disconnect();}catch(_){}});
  for(const k of Object.keys(audios))delete audios[k];for(const k of Object.keys(nodes))delete nodes[k];for(const k of Object.keys(ui))delete ui[k];
  soloed.clear();muted.clear();playing=false;playBtn.innerHTML='&#9654; PLAY';
  LANES.forEach(lane=>{
    const row=document.createElement('div');row.className='lane';row.dataset.lane=lane.key;
    row.innerHTML=`<div class="name">${lane.label}</div><button type=button class="lbtn solo" data-k="${lane.key}">SOLO</button><button type=button class="lbtn mute" data-k="${lane.key}">MUTE</button><input class="vol" data-k="${lane.key}" type=range min=0 max=1 step=0.01 value="0.85"><div class="meter">85</div>`;
    mixer.appendChild(row);
    const a=new Audio();a.crossOrigin='anonymous';a.preload='auto';a.src=`${MEDIA}/${stub}/${lane.key}.${EXT}`;audios[lane.key]=a;
    ui[lane.key]={row,soloBtn:row.querySelector('.solo'),muteBtn:row.querySelector('.mute'),vol:row.querySelector('.vol'),meter:row.querySelector('.meter')};
    ui[lane.key].soloBtn.addEventListener('click',(e)=>{e.preventDefault();if(ui[lane.key].soloBtn.disabled)return;if(soloed.has(lane.key))soloed.delete(lane.key);else soloed.add(lane.key);applyMix();});
    ui[lane.key].muteBtn.addEventListener('click',(e)=>{e.preventDefault();if(ui[lane.key].muteBtn.disabled)return;if(muted.has(lane.key))muted.delete(lane.key);else muted.add(lane.key);applyMix();});
    ui[lane.key].vol.addEventListener('input',(e)=>{ui[lane.key].meter.textContent=Math.round(e.target.value*100);applyMix();});
    a.addEventListener('loadedmetadata',updateTime);
    a.addEventListener('error',()=>{ui[lane.key].meter.textContent='-';ui[lane.key].soloBtn.disabled=true;ui[lane.key].muteBtn.disabled=true;ui[lane.key].vol.disabled=true;a.dataset.missing='1';ui[lane.key].row.classList.add('is-missing');});
  });
}
function wireGraph(){ensureCtx();LANES.forEach(lane=>{const a=audios[lane.key];if(!a||nodes[lane.key])return;try{const src=ctx.createMediaElementSource(a);const gain=ctx.createGain();gain.gain.value=0;src.connect(gain).connect(ctx.destination);nodes[lane.key]={src,gain};}catch(err){}});}
function applyMix(){LANES.forEach(lane=>{const u=ui[lane.key];if(!u)return;const a=audios[lane.key];if(!a)return;let v=parseFloat(u.vol.value);const anySolo=soloed.size>0,isSolo=soloed.has(lane.key),isMute=muted.has(lane.key);const silenced=isMute||(anySolo&&!isSolo)||!!a.dataset.missing;const target=silenced?0:Math.max(0,Math.min(1,v));const n=nodes[lane.key];if(n&&ctx){const t=ctx.currentTime;n.gain.gain.cancelScheduledValues(t);n.gain.gain.setTargetAtTime(target,t,RAMP);}else{a.volume=target;}u.soloBtn.classList.toggle('active',isSolo);u.muteBtn.classList.toggle('active',isMute);u.row.classList.toggle('is-muted',silenced&&!a.dataset.missing);});}
function resetMix(){soloed.clear();muted.clear();LANES.forEach(lane=>{if(!ui[lane.key])return;ui[lane.key].vol.value=0.85;ui[lane.key].meter.textContent=85;});applyMix();}
function activeAudios(){return Object.values(audios).filter(a=>!a.dataset.missing);}
function masterDuration(){let d=0;activeAudios().forEach(a=>{if(isFinite(a.duration)&&a.duration>d)d=a.duration;});return d;}
function masterTime(){const a=activeAudios()[0];return a?a.currentTime:0;}
function updateTime(){const d=masterDuration(),t=masterTime();timeEl.textContent=fmt(t)+' / '+fmt(d);if(d>0)scrub.value=Math.round((t/d)*1000);}
playBtn.onclick=async()=>{if(playing){activeAudios().forEach(a=>a.pause());playing=false;playBtn.innerHTML='&#9654; PLAY';return;}ensureCtx();if(ctx.state==='suspended')await ctx.resume();wireGraph();const lead=activeAudios()[0];if(!lead)return;activeAudios().forEach(a=>{if(a!==lead)a.currentTime=lead.currentTime;});applyMix();await Promise.all(activeAudios().map(a=>a.play().catch(()=>{})));playing=true;playBtn.innerHTML='&#9208; PAUSE';};
stopBtn.onclick=()=>{activeAudios().forEach(a=>{a.pause();a.currentTime=0;});playing=false;playBtn.innerHTML='&#9654; PLAY';updateTime();};
document.getElementById('reset').onclick=()=>resetMix();
scrub.oninput=(e)=>{const d=masterDuration(),t=(e.target.value/1000)*d;activeAudios().forEach(a=>{a.currentTime=t;});updateTime();};
/* stem-sync-hardener v1 inline */setInterval(()=>{if(!playing)return;const list=activeAudios().filter(a=>!a.paused&&!a.seeking&&isFinite(a.duration)&&a.readyState>=2);if(list.length>=2){const ts=list.map(a=>a.currentTime).sort((x,y)=>x-y);const ref=ts[Math.floor(ts.length/2)];list.forEach(a=>{const diff=a.currentTime-ref,ad=Math.abs(diff);if(ad>0.30){a.playbackRate=1;try{a.currentTime=ref;}catch(_){}}else if(ad>0.005){const trim=Math.min(0.08,ad*2);a.playbackRate=diff>0?(1-trim):(1+trim);}else if(a.playbackRate!==1){a.playbackRate=1;}});}updateTime();},200);
songSel.onchange=()=>{rebuildLanes(songSel.value);statusEl.textContent='loaded: '+songSel.value;const u=new URL(window.location.href);u.searchParams.set('song',songSel.value);history.replaceState(null,'',u.toString());};
const initStub=(new URLSearchParams(window.location.search)).get('song');
const startStub=(initStub&&SONGS.find(s=>s.stub===initStub))?initStub:SONGS[0].stub;
songSel.value=startStub;rebuildLanes(startStub);statusEl.textContent='ready - pick a song and hit play';
</script>

<script>
(function(){
  /* plain-word dictionary, whole word, case-insensitive. Expand freely. */
  var KID = {
    midi:"computer music notes", stems:"split-apart song tracks", stem:"song track",
    demucs:"song splitter", ixi:"deep song study", vercel:"the website host",
    deploy:"put online", deployed:"put online", deploying:"putting online",
    dashboard:"info board", hook:"auto-helper", skill:"tool", skills:"tools",
    ntfy:"phone alerts", queue:"to-do list", tarot:"fortune cards",
    songsterr:"guitar-tab site", html:"web page", repo:"code folder",

    api:"app link", etsy:"craft shop", gumroad:"online shop", fiverr:"gig shop",
    obsidian:"notes app", transcript:"written recording", ableton:"music app",
    xtts:"computer voice", elevenlabs:"computer voice", deepseek:"helper AI",

    chord:"music chord", chords:"music chords", handoff:"pass-along note",
    session:"chat", workflow:"auto task chain", n8n:"auto task app",

    inventory:"the stuff for sale", portfolio:"the whole set",

    impressions:"times shown", checkout:"the paying step", upsell:"add-on offer",
    audit:"check-up", verdict:"the call", roi:"money back", kpi:"key number"

  function kidifyText(s){
    if(!s) return s;
    return s.replace(/[A-Za-z][A-Za-z0-9'\-]*/g, function(w){
      var h = KID[w.toLowerCase()];
      if(!h) return w;
      // keep capitalization of the first letter
      return (w[0] === w[0].toUpperCase()) ? h.charAt(0).toUpperCase()+h.slice(1) : h;
    });
  }
  var SKIP = {SCRIPT:1,STYLE:1,CODE:1,PRE:1,TEXTAREA:1,KBD:1,SAMP:1,NOSCRIPT:1};
  var nodes = [];            // {node, original}
  var els   = [];            // {el, originalText, kidText} for data-kid overrides
  function collect(){
    nodes = []; els = [];
    var btn = document.getElementById('mode-btn');
    var walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, {
      acceptNode:function(n){
        if(!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
        var p = n.parentNode;

          if(p === btn) return NodeFilter.FILTER_REJECT;

    }
  }
  window.kidRecollect = collect;   // call after dynamic re-renders
  function apply(on){
    if(!nodes.length && !els.length) collect();
    for(var i=0;i<nodes.length;i++){
      nodes[i].node.nodeValue = on ? kidifyText(nodes[i].original) : nodes[i].original;
    }
    for(var j=0;j<els.length;j++){
      els[j].el.textContent = on ? els[j].kidText : els[j].originalText;
    }
  }
  window.toggleKid = function(){
    var on = !document.body.classList.contains('kids');
    document.body.classList.toggle('kids', on);
    var b = document.getElementById('mode-btn');
    if(b){ b.textContent = on ? '🧑‍🏫 Grown-up mode' : '🧒 Kid mode';
           b.setAttribute('aria-pressed', on ? 'true' : 'false'); }

    try{ localStorage.setItem('kidmode', on ? '1' : '0'); }catch(e){}
  };
  function boot(){

    try{ saved = localStorage.getItem('kidmode') || '0'; }catch(e){}

      document.body.classList.add('kids');
      var b = document.getElementById('mode-btn');
      if(b){ b.textContent = '🧑‍🏫 Grown-up mode'; b.setAttribute('aria-pressed','true'); }
      apply(true);
    }
  }

  else boot();
})();

        '<div class="meter">85</div>';
      mixer.appendChild(row);
      var g=ctx.createGain(); g.gain.value=0.85; g.connect(master);
      var o={key:L.key,label:L.label,gain:g,row:row,
        vol:row.querySelector('.vol'),soloBtn:row.querySelector('.solo'),
        muteBtn:row.querySelector('.mute'),meter:row.querySelector('.meter'),missing:false};
      o.soloBtn.addEventListener('click',function(e){e.preventDefault();if(o.missing)return;soloed[o.key]=!soloed[o.key];applyMix();});
      o.muteBtn.addEventListener('click',function(e){e.preventDefault();if(o.missing)return;muted[o.key]=!muted[o.key];applyMix();});
      o.vol.addEventListener('input',function(){o.meter.textContent=Math.round(o.vol.value*100);applyMix();});
      lanes.push(o);
    });
  }

  function applyMix(){
    var anySolo=lanes.some(function(l){return soloed[l.key];});
    lanes.forEach(function(l){
      var v=parseFloat(l.vol.value)||0;
      var silenced=l.missing||muted[l.key]||(anySolo&&!soloed[l.key]);
      l.gain.gain.setTargetAtTime(silenced?0:v, ctx.currentTime, 0.012);
      if(l.soloBtn) l.soloBtn.classList.toggle('active',!!soloed[l.key]);
      if(l.muteBtn) l.muteBtn.classList.toggle('active',!!muted[l.key]);
      l.row.classList.toggle('is-muted',silenced&&!l.missing);
    });
  }

  function startSources(offset){
    Object.keys(sources).forEach(function(k){ try{sources[k].stop();sources[k].disconnect();}catch(e){} });
    sources={};
    offset=Math.max(0,Math.min(offset,duration||0));
    var t0=ctx.currentTime+0.06;          // one lead time for ALL stems -> identical start instant
    lanes.forEach(function(l){
      var buf=buffers[l.key]; if(!buf) return;
      var s=ctx.createBufferSource(); s.buffer=buf; s.connect(l.gain); s.start(t0,offset);
      sources[l.key]=s;
    });
    startCtxTime=t0; startOffset=offset; playing=true;
    playBtn.innerHTML='&#9208; PAUSE';
    requestAnimationFrame(tick);
  }
  function pause(){ if(!playing)return; pausedAt=curPos(); Object.keys(sources).forEach(function(k){try{sources[k].stop();}catch(e){}}); sources={}; playing=false; playBtn.innerHTML='&#9654; PLAY'; }
  function stopZero(){ Object.keys(sources).forEach(function(k){try{sources[k].stop();}catch(e){}}); sources={}; playing=false; pausedAt=0; playBtn.innerHTML='&#9654; PLAY'; timeEl.textContent=fmt(0)+' / '+fmt(duration); scrub.value=0; }

  function tick(){
    var p=curPos();
    if(playing && duration>0 && p>=duration){ stopZero(); return; }
    timeEl.textContent=fmt(p)+' / '+fmt(duration);
    if(duration>0) scrub.value=Math.round(Math.min(1,p/duration)*1000);
    if(playing) requestAnimationFrame(tick);
  }

  function loadSong(stub){
    var my=++loadToken;
    pause(); pausedAt=0; duration=0; buffers={}; soloed={}; muted={};
    buildMixer();
    var total=lanes.length, done=0, loaded=0;
    if(statusEl) statusEl.textContent='loading stems 0/'+total+'…';
    // PARALLEL load — all stems fetch+decode at once, far faster than sequential.
    lanes.forEach(function(l){
      fetch(BASE+'/'+enc(stub)+'/'+l.key+'.'+EXT,{mode:'cors'})
        .then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); })
        .then(function(arr){ if(my!==loadToken) throw 1; return decode(arr); })
        .then(function(buf){ if(my!==loadToken) throw 1; var m=monoDownmix(buf); buffers[l.key]=m; if(m.duration>duration)duration=m.duration; loaded++; })
        .catch(function(err){ if(err===1) return; l.missing=true; l.meter.textContent='-'; l.soloBtn.disabled=true; l.muteBtn.disabled=true; l.vol.disabled=true; l.row.classList.add('is-missing'); })
        .then(function(){
          if(my!==loadToken) return;
          done++;
          if(statusEl && done<total) statusEl.textContent='loading stems '+done+'/'+total+'…';
          if(done>=total){
            applyMix(); timeEl.textContent=fmt(0)+' / '+fmt(duration);
            if(statusEl) statusEl.textContent = loaded? ('ready — '+loaded+' stems locked to one clock. press play.') : 'no stems found for this song.';
            if(wantPlay && loaded){ wantPlay=false; if(ctx.state==='suspended'){ctx.resume();} startSources(0); }
          }
        });
    });
  }

  playBtn.addEventListener('click',function(){
    if(ctx.state==='suspended'){ ctx.resume().then(function(){}); }
    if(playing){ pause(); return; }
    if(duration<=0){ wantPlay=true; if(statusEl) statusEl.textContent='loading stems… will start when ready'; return; }
    startSources(pausedAt>=duration?0:pausedAt);
  });
  if(stopBtn) stopBtn.addEventListener('click',function(){ stopZero(); });
  if(resetBtn) resetBtn.addEventListener('click',function(){ soloed={};muted={}; lanes.forEach(function(l){l.vol.value=0.85;l.meter.textContent=85;}); applyMix(); });
  scrub.addEventListener('input',function(){
    if(duration<=0) return;
    var t=(scrub.value/1000)*duration;
    if(playing){ startSources(t); } else { pausedAt=t; timeEl.textContent=fmt(t)+' / '+fmt(duration); }
  });
  songSel.addEventListener('change',function(){
    loadSong(songSel.value);
    try{ var u=new URL(location.href); u.searchParams.set('song',songSel.value); history.replaceState(null,'',u.toString()); }catch(e){}
  });

  var initStub=(new URLSearchParams(location.search)).get('song');
  var startStub=(initStub && SONGLIST.some(function(s){return s.stub===initStub;})) ? initStub : (SONGLIST[0]&&SONGLIST[0].stub);
  if(startStub){ songSel.value=startStub; loadSong(startStub); }

  // debug accessor (read-only); lets a test confirm decode + lock from outside the closure
  window.__stemDbg=function(){ return {engine:true, ctx:ctx.state, duration:duration, playing:playing,
    pos:curPos(), lanes:lanes.length, loaded:Object.keys(buffers).length, sources:Object.keys(sources).length,
    missing:lanes.filter(function(l){return l.missing;}).map(function(l){return l.key;})}; };
})();
</script>

</body></html>
