<html lang="en">

<meta charset="utf-8">
<title>Stems Map (all Macs)</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161922; --text: #e6e9ef; --muted: #8a93a5;
    --accent: #7aa2f7; --border: #262a36; --row-alt: #1a1e29;
    --pill: #2a3142; --selected: #2a3a5a;
    --warn: #d7785e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5; height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  header {
    padding: 12px 22px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex: 0 0 auto;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  .mac-picker { display: flex; gap: 6px; flex-wrap: wrap; }
  .mac-pill {
    background: var(--pill); color: var(--text);
    padding: 6px 12px; border-radius: 12px; font-size: 12px;
    cursor: pointer; border: 1px solid transparent; user-select: none;
  }
  .mac-pill.active { border-color: var(--accent); color: var(--accent); }
  .mac-pill .scan-time { color: var(--muted); font-size: 10px; margin-left: 6px; }
  main {
    flex: 1; display: grid; grid-template-columns: 340px 1fr; overflow: hidden;
  }
  .left {
    border-right: 1px solid var(--border); overflow-y: auto; background: var(--bg);
  }
  .right {
    overflow-y: auto; padding: 18px 22px; background: var(--bg);
  }
  table { width: 100%; border-collapse: collapse; }
  .left th {
    background: #1c2030; text-transform: uppercase; font-size: 11px;
    letter-spacing: 0.5px; color: var(--muted); padding: 8px 14px;
    text-align: left; border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
  }
  .left td {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    cursor: pointer; font-size: 13px;
  }
  .left tr:hover td { background: var(--row-alt); }
  .left tr.selected td {
    background: var(--selected); color: var(--accent); font-weight: 600;
  }
  .count {
    color: var(--muted); font-size: 11px; background: var(--pill);
    padding: 2px 8px; border-radius: 10px; margin-left: 6px; display: inline-block;
  }
  .left tr.selected .count { background: var(--accent); color: var(--bg); }
  .only-here {
    font-size: 10px; background: #4a3a26; color: #ffd28a;
    padding: 1px 6px; border-radius: 8px; margin-left: 4px;
  }
  .only-there {
    font-size: 10px; background: #2a4a3a; color: #8affb4;
    padding: 1px 6px; border-radius: 8px; margin-left: 4px;
  }
  .both {
    font-size: 10px; background: #263a5a; color: #7aa2f7;
    padding: 1px 6px; border-radius: 8px; margin-left: 4px;
  }
  .right h2 { margin: 0 0 4px; font-size: 22px; }
  .album-line { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .album-block { margin-bottom: 24px; }
  .album-header {
    color: var(--accent); font-size: 15px; font-weight: 600;
    padding-bottom: 6px; margin-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .right table {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
  }
  .right th {
    background: #1c2030; text-transform: uppercase; font-size: 11px;
    letter-spacing: 0.5px; color: var(--muted); padding: 8px 12px; text-align: left;
  }
  .right td {
    padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top;
  }
  .right tr:nth-child(even) td { background: var(--row-alt); }
  .right tr:last-child td { border-bottom: none; }
  td.stems span {
    display: inline-block; background: var(--pill); padding: 2px 6px;
    border-radius: 4px; font-size: 11px; margin-right: 3px; margin-bottom: 2px;
  }
  td.path {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; color: var(--muted); cursor: pointer;
    max-width: 420px; word-break: break-all;
  }
  td.path:hover { color: var(--accent); }
  td.fmt { color: var(--muted); font-size: 12px; white-space: nowrap; }
  td.host-tag { font-size: 11px; color: var(--muted); }
  .placeholder-tag {
    display: inline-block; font-size: 11px; background: #4a2a26;
    color: #ffb4a2; padding: 2px 8px; border-radius: 10px; margin-left: 8px;
  }
  .copy-hint { color: var(--muted); font-size: 11px; margin-top: 12px; }
  .empty-state { color: var(--muted); text-align: center; margin-top: 60px; }
</style>

.mode-btn{position:fixed;top:12px;right:12px;z-index:9999;padding:9px 16px;border:none;border-radius:999px;background:#4E8079;color:#fff;font:600 14px/1 system-ui,-apple-system,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.22)}
body.kids .mode-btn{background:#B4503E}
body.kids .mode-btn::before{content:"🧒  "}
#kidpanel{display:none}
body.kids #kidpanel{display:block;max-width:760px;margin:62px auto 12px;background:#fff7e8;border:2px solid #4E8079;border-radius:18px;padding:20px 24px;font:18px/1.7 system-ui,-apple-system,sans-serif;color:#2b2820}
body.kids #kidpanel h3{font-family:"Fredoka","Comic Sans MS",sans-serif;color:#4E8079;margin:0 0 8px;font-size:22px}
body.kids #kidpanel b{color:#B4503E}
body.kids{font-size:1.04em}
</style>

let activeMac = "__ALL__";   // "__ALL__" means combined view

function allHostnames() { return Object.keys(ALL_INVENTORIES); }

function combinedBands() {
  // bands -> { albums: {alb: {songs: [{...song, host}]}} }
  const out = {};
  for (const host of allHostnames()) {
    const inv = ALL_INVENTORIES[host];
    for (const [band, albums] of Object.entries(inv.bands || {})) {
      const b = out[band] = out[band] || {};
      for (const [alb, info] of Object.entries(albums)) {
        const a = b[alb] = b[alb] || { songs: [], placeholder: info.placeholder, note: info.note };
        for (const s of info.songs) {
          a.songs.push({ ...s, host });
        }
      }
    }
  }
  return out;
}

function bandsForActiveMac() {
  if (activeMac === "__ALL__") return combinedBands();
  const inv = ALL_INVENTORIES[activeMac];
  if (!inv) return {};
  // Tag every song with its host
  const out = {};
  for (const [band, albums] of Object.entries(inv.bands || {})) {
    const b = out[band] = {};
    for (const [alb, info] of Object.entries(albums)) {
      b[alb] = { ...info, songs: info.songs.map(s => ({ ...s, host: activeMac })) };
    }
  }
  return out;
}

function songCount(albums) {
  return Object.values(albums).reduce((n, alb) => n + (alb.placeholder ? 0 : alb.songs.length), 0);
}

function hostsForBand(band) {
  const hosts = new Set();
  for (const host of allHostnames()) {
    if (ALL_INVENTORIES[host].bands && ALL_INVENTORIES[host].bands[band]) {
      hosts.add(host);
    }
  }
  return hosts;
}

// Pop the Mac picker
function renderMacPicker() {
  const wrap = document.getElementById('macPicker');
  wrap.innerHTML = '';
  const hosts = allHostnames();
  const all = document.createElement('div');
  all.className = 'mac-pill' + (activeMac === '__ALL__' ? ' active' : '');
  all.textContent = `All Macs (${hosts.length})`;
  all.addEventListener('click', () => { activeMac = '__ALL__'; render(); });
  wrap.appendChild(all);
  hosts.forEach(h => {
    const pill = document.createElement('div');
    pill.className = 'mac-pill' + (activeMac === h ? ' active' : '');
    const inv = ALL_INVENTORIES[h];
    pill.innerHTML = `${h}<span class="scan-time">${inv.scanned_at || ''}</span>`;
    pill.addEventListener('click', () => { activeMac = h; render(); });
    wrap.appendChild(pill);
  });

  const meta = document.getElementById('meta');
  const totalSongs = hosts.reduce((sum, h) => {
    return sum + Object.values(ALL_INVENTORIES[h].bands || {}).reduce((n, albs) =>
      n + Object.values(albs).reduce((m, a) => m + (a.placeholder ? 0 : a.songs.length), 0), 0);
  }, 0);
  meta.textContent = `${hosts.length} Mac${hosts.length === 1 ? '' : 's'} indexed · ${totalSongs} stem-sets total`;
}

function renderBandList() {
  const bl = document.getElementById('bandList');
  bl.innerHTML = '';
  const bands = bandsForActiveMac();
  const allHosts = allHostnames();
  const ordered = Object.keys(bands).sort((a, b) => a.localeCompare(b));
  ordered.forEach(name => {
    const count = songCount(bands[name]);
    const tr = document.createElement('tr');
    tr.dataset.band = name;
    let tag = '';
    if (activeMac === '__ALL__' && allHosts.length > 1) {
      const hosts = hostsForBand(name);
      if (hosts.size === allHosts.length) {
        tag = ' <span class="both">both</span>';
      } else if (hosts.size === 1) {
        const only = Array.from(hosts)[0];
        tag = ` <span class="only-here">only ${only}</span>`;
      }
    }
    tr.innerHTML = `<td>${name}<span class="count">${count}</span>${tag}</td>`;
    tr.addEventListener('click', () => selectBand(name));
    bl.appendChild(tr);
  });
}

let selectedBand = null;
function selectBand(name) {
  selectedBand = name;
  document.querySelectorAll('#bandList tr').forEach(r =>
    r.classList.toggle('selected', r.dataset.band === name));
  renderDetail(name);
}

function renderDetail(name) {
  const detail = document.getElementById('detail');
  const bands = bandsForActiveMac();
  const band = bands[name];
  if (!band) { detail.innerHTML = '<div class="empty-state">No data for that band on this Mac.</div>'; return; }
  let html = `<h2>${name}</h2>`;
  const totalSongs = songCount(band);
  html += `<div class="album-line">${Object.keys(band).length} album block${Object.keys(band).length === 1 ? '' : 's'} · ${totalSongs} stem set${totalSongs === 1 ? '' : 's'}</div>`;

  Object.entries(band).forEach(([albumName, album]) => {
    const isPlaceholder = !!album.placeholder;
    html += `<div class="album-block">`;
    html += `<div class="album-header">${albumName}${isPlaceholder ? ' <span class="placeholder-tag">placeholder</span>' : ''}</div>`;
    if (album.note) html += `<div class="album-line" style="margin: -4px 0 10px">${album.note}</div>`;
    const showHost = activeMac === '__ALL__';
    html += `<table><thead><tr>`;
    html += `<th style="width: 36%">Song</th><th>Stems</th><th>Format</th>`;
    if (showHost) html += `<th>Mac</th>`;
    html += `<th>Path</th></tr></thead><tbody>`;
    album.songs.forEach(song => {
      const stemsCell = isPlaceholder
        ? '—'
        : (song.stems || []).map(s => `<span>${s.replace(/\.[^.]+$/, '')}</span>`).join('');
      const hostCell = showHost ? `<td class="host-tag">${song.host}</td>` : '';
      html += `<tr><td>${song.song}</td><td class="stems">${stemsCell}</td><td class="fmt">${song.format || ''}</td>${hostCell}<td class="path">${song.path}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  });

  html += `<div class="copy-hint">Click any path cell to copy it.</div>`;
  detail.innerHTML = html;

  detail.querySelectorAll('td.path').forEach(td => {
    td.addEventListener('click', () => {
      navigator.clipboard.writeText(td.textContent.trim());
      const orig = td.style.color;
      td.style.color = 'var(--accent)';
      setTimeout(() => td.style.color = orig, 400);
    });
  });
}

function render() {
  renderMacPicker();
  renderBandList();
  if (selectedBand) {
    const tr = document.querySelector(`#bandList tr[data-band="${CSS.escape(selectedBand)}"]`);
    if (tr) { tr.classList.add('selected'); renderDetail(selectedBand); }
    else { document.getElementById('detail').innerHTML = '<div class="empty-state">Select a band on the left.</div>'; }
  } else {
    const first = document.querySelector('#bandList tr');
    if (first) selectBand(first.dataset.band);
  }
}

render();
</script>
